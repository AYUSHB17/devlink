<!doctype html>
<html>
<head><meta charset="utf-8" /><link rel="stylesheet" href="popup.css" /></head>
<body>
  <h1>DevLink</h1>
  <div id="status" class="muted">Looking for your devices…</div>
  <label id="pick" hidden>Send to <select id="device"></select></label>
  <div id="actions" hidden>
    <button id="tab" class="primary">Send this tab</button>
    <button id="all">Send all tabs in this window</button>
  </div>
  <p class="muted small"><a href="#" id="options">Options</a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
